name: Deploy Azure Functions App

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:  # Allows manual triggering

env:
  AZURE_FUNCTIONAPP_NAME: invoice-extractor-app
  PYTHON_VERSION: '3.9'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Build Azure Functions package
      run: |
        mkdir -p .package
        cp -r src .package/
        cp function_app.py .package/
        cp requirements.txt .package/
        cp host.json .package/ || echo "No host.json file found"
        
        # Include function.json files for individual functions if they exist
        mkdir -p .package/SRN
        cp -r SRN/* .package/SRN/ || echo "No SRN folder found"
        mkdir -p .package/RN_Design
        cp -r RN_Design/* .package/RN_Design/ || echo "No RN_Design folder found"
        mkdir -p .package/Salefish
        cp -r Salefish/* .package/Salefish/ || echo "No Salefish folder found"

    - name: Deploy to Azure Functions
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: .package
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

    - name: Post-deployment check
      run: |
        echo "Waiting for deployment to stabilize..."
        sleep 30
        echo "Deployment completed! Verify in Azure Portal." 